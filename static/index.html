<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>zendarq · dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body x-data="dashboard" x-init="init()">

<header class="topbar">
  <div class="brand">
    <h1>zendarq</h1>
    <span class="tag">dashboard</span>
  </div>
  <div class="topbar-right">
    <span class="clock" x-text="headerTime"></span>
    <div class="unit-toggle" role="group" aria-label="Temperature unit">
      <button :class="units === 'f' && 'active'" @click="toggleUnits('f')" aria-label="Fahrenheit">°F</button>
      <button :class="units === 'c' && 'active'" @click="toggleUnits('c')" aria-label="Celsius">°C</button>
    </div>
    <button class="refresh-btn" @click="refreshNow()" :disabled="refreshing" aria-label="Refresh data">
      <span class="refresh-icon" :class="refreshing && 'spin'">⟳</span>
    </button>
  </div>
</header>

<nav class="chips" aria-label="Cities">
  <template x-for="c in citiesMeta" :key="c.id">
    <button class="chip" :class="isSelected(c.id) && 'active'" @click="toggleCity(c.id)">
      <span x-text="c.name"></span>
    </button>
  </template>
</nav>

<section class="fx">
  <div class="fx-head">
    <h2>Currencies</h2>
    <span class="fx-updated" x-show="fxUpdated" x-text="'updated ' + fxUpdated"></span>
  </div>
  <div class="fx-strip">
    <template x-for="p in fx" :key="p.pair">
      <div class="fx-card">
        <div class="fx-pair" x-text="p.pair"></div>
        <div class="fx-rate" x-text="fxRate(p)"></div>
        <div class="fx-change" :class="fxChangeClass(p, 1)" x-text="fxChangeText(p, 1)"></div>
        <div class="fx-spark">
          <canvas :id="'fxchart-' + fxId(p)"></canvas>
        </div>
      </div>
    </template>
  </div>
</section>

<main class="grid">
  <template x-for="cid in selected" :key="cid">
    <section class="card">
      <div class="card-head">
        <h2 x-text="cityName(cid)"></h2>
        <span class="city-time" x-text="clockFor(cid)"></span>
      </div>

      <div class="cond-row">
        <span class="big-temp" x-text="tempDisplay(cid)"></span>
        <div class="cond-meta">
          <div class="cond-emoji" x-text="emojiFor(cid)"></div>
          <div class="cond-label" x-text="labelFor(cid)"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><span>Feels like</span><b x-text="feelsDisplay(cid)"></b></div>
        <div class="stat"><span>Humidity</span><b x-text="humidityDisplay(cid)"></b></div>
        <div class="stat"><span>Wind</span><b x-text="windDisplay(cid)"></b></div>
        <div class="stat"><span>Precip</span><b x-text="precipDisplay(cid)"></b></div>
      </div>

      <div class="chart-wrap">
        <canvas :id="'chart-' + cid" aria-label="24 hour temperature trend"></canvas>
      </div>

      <div class="forecast" x-show="daily[cid]">
        <template x-for="d in daily[cid]" :key="d.date">
          <div class="day" :class="isToday(d.date) && 'today'">
            <span class="day-name" x-text="weekdayOf(d.date)"></span>
            <span class="day-emoji" x-text="emojiCode(d.weather_code)"></span>
            <span class="day-temps">
              <b x-text="tempText(d.tmax_c)"></b>
              <i x-text="tempText(d.tmin_c)"></i>
            </span>
          </div>
        </template>
      </div>

      <template x-if="daily[cid] && daily[cid][0]">
        <div class="sun-times">
          <span>🌅 <b x-text="sunTime(daily[cid][0].sunrise)"></b></span>
          <span>🌇 <b x-text="sunTime(daily[cid][0].sunset)"></b></span>
        </div>
      </template>
    </section>
  </template>
</main>

<footer>
  <span x-show="lastUpdated">Updated <b x-text="lastUpdated"></b> · auto-refreshes every 15 min</span>
  <span x-show="!lastUpdated">Loading…</span>
</footer>

<script src="/static/app.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
</body>
</html>
